
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Photo Universe ☁️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>

  <style>
    :root {
      --bg: #fff8fc;
      --pink: #f5b8d2;
      --pink-dark: #d96b9d;
      --text: #5c4353;
      --muted: #a58b9d;
      --card: #ffffff;
      --border: #f2dce9;
      --shadow: 0 8px 25px rgba(166, 106, 145, 0.13);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, #ffe7f1 0, transparent 30%),
        radial-gradient(circle at 85% 20%, #e9eaff 0, transparent 32%),
        var(--bg);
      font-family: "Trebuchet MS", Arial, sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--border);
      color: var(--text);
      background: white;
      padding: 10px 15px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--pink-dark);
      color: white;
      border-color: var(--pink-dark);
    }

    button.danger {
      color: #fff;
      background: #d94b72;
      border-color: #d94b72;
    }

    .hidden {
      display: none !important;
    }

    header {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: linear-gradient(to bottom, rgba(255, 248, 252, 0.96), rgba(255, 248, 252, 0.72));
      backdrop-filter: blur(12px);
    }

    .brand {
      min-width: 190px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(18px, 3vw, 25px);
      letter-spacing: -0.7px;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    #status {
      position: fixed;
      z-index: 30;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100vw - 32px);
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text);
      font-size: 13px;
      text-align: center;
    }

    #loginPanel {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(255, 248, 252, 0.88);
      backdrop-filter: blur(10px);
    }

    .login-card {
      width: min(360px, 100%);
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: white;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .login-card h2 {
      margin: 0 0 8px;
    }

    .login-card p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .login-card input {
      width: 100%;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline-color: var(--pink-dark);
    }

    .login-card button {
      width: 100%;
      margin-top: 10px;
    }

    #universe {
      position: fixed;
      inset: 95px 0 55px;
      overflow: hidden;
      touch-action: none;
      cursor: grab;
    }

    #universe.dragging {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform: translate(0, 0) scale(1);
      transform-origin: center;
      will-change: transform;
    }

    .card {
      position: absolute;
      width: 145px;
      padding: 7px 7px 10px;
      border: 1px solid rgba(242, 220, 233, 0.95);
      border-radius: 13px;
      background: var(--card);
      box-shadow: var(--shadow);
      user-select: none;
      transform: translate(-50%, -50%);
      animation: bloom 0.9s cubic-bezier(.16, .8, .25, 1) both;
      animation-delay: var(--delay, 0ms);
    }

    .card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      background: #fff0f7;
      pointer-events: none;
    }

    .card-date {
      display: block;
      padding-top: 8px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .card-controls {
      display: none;
      gap: 5px;
      justify-content: center;
      flex-wrap: wrap;
      padding-top: 7px;
    }

    .editing .card-controls {
      display: flex;
    }

    .card-controls button {
      padding: 5px 8px;
      font-size: 11px;
    }

    @keyframes bloom {
      from {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--from-x, 0px)),
            calc(-50% + var(--from-y, 0px))
          )
          scale(0.25) rotate(-8deg);
      }

      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0);
      }
    }

    #hint {
      position: fixed;
      bottom: 68px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      width: calc(100% - 30px);
      pointer-events: none;
    }

    @media (max-width: 650px) {
      header {
        padding: 12px;
        align-items: flex-start;
      }

      .brand {
        min-width: 100%;
      }

      .actions {
        gap: 6px;
      }

      .actions button {
        padding: 8px 11px;
        font-size: 12px;
      }

      #universe {
        inset: 135px 0 55px;
      }

      .card {
        width: 112px;
        padding: 5px 5px 8px;
      }

      .card-date {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <h1 id="wallTitle">Our Little Photo Universe ☁️</h1>
      <p>Every little memory has its own place ✨</p>
    </div>

    <div class="actions">
      <button id="loginBtn">♡ Log in</button>
      <button id="uploadBtn" class="primary hidden">＋ Add photos</button>
      <button id="deleteAllBtn" class="danger hidden">🗑️ Delete All</button>
      <button id="titleBtn" class="hidden">✎ Wall title</button>
      <button id="logoutBtn" class="hidden">Log out</button>
    </div>
  </header>

  <div id="loginPanel" class="hidden">
    <div class="login-card">
      <h2>Welcome back ♡</h2>
      <p>Log in to manage your little universe.</p>

      <form id="loginForm">
        <input
          id="email"
          type="email"
          placeholder="Email address"
          autocomplete="username"
          required
        >

        <input
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit" class="primary">Log in</button>
        <button type="button" id="cancelLogin">Cancel</button>
      </form>
    </div>
  </div>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
    multiple
    class="hidden"
  >

  <main id="universe" aria-label="Photo universe">
    <div id="world"></div>
  </main>

  <div id="hint">
    Drag to explore · Scroll or pinch to zoom · Log in to edit your memories
  </div>

  <div id="status" role="status">Loading your universe… ☁️</div>

  <script>
    /* ==========================================
       SUPABASE CONFIGURATION
       ========================================== */

    const SUPABASE_URL = "https://lekewvjkjwrtcpaizxux.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_yeuYMWyCW_vQi-Sti3WkxQ_esCVzCts";
    const BUCKET = "photo-wall";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ==========================================
       STATE
       ========================================== */

    const $ = id => document.getElementById(id);

    let session = null;
    let photos = [];
    let busy = false;

    let zoom = 1;
    let panX = 0;
    let panY = 0;

    let dragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialPanX = 0;
    let initialPanY = 0;

    let pinchStartDistance = 0;
    let pinchStartZoom = 1;

    /* ==========================================
       GENERAL HELPERS
       ========================================== */

    function status(message) {
      $("status").textContent = message;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function getPublicURL(path) {
      const { data } = db.storage.from(BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }

    function formatDate(value) {
      if (!value) return "Date unknown";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return "Date unknown";
      }

      return new Intl.DateTimeFormat(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric"
      }).format(date);
    }

    async function sha256(file) {
      const buffer = await file.arrayBuffer();
      const hash = await crypto.subtle.digest("SHA-256", buffer);

      return Array.from(new Uint8Array(hash))
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("");
    }

    function safeFilename(name) {
      return name
        .normalize("NFKD")
        .replace(/[^\w.-]+/g, "_")
        .replace(/^_+|_+$/g, "")
        .slice(-120) || "photo";
    }

    /* ==========================================
       PHOTO SPHERE LAYOUT
       ========================================== */

    function spherePosition(index) {
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const angle = index * goldenAngle;
      const radius = 76 * Math.sqrt(index);

      return {
        x: Math.cos(angle) * radius,
        y: Math.sin(angle) * radius
      };
    }

    function applyWorldTransform() {
      $("world").style.transform =
        `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }

    function render(animate = true) {
      const world = $("world");
      world.innerHTML = "";

      $("universe").classList.toggle("editing", !!session);

      photos.forEach((photo, index) => {
        const position = spherePosition(index);
        const card = document.createElement("article");

        card.className = "card";
        card.style.left = `${position.x}px`;
        card.style.top = `${position.y}px`;

        if (animate) {
          card.style.setProperty("--from-x", `${-position.x}px`);
          card.style.setProperty("--from-y", `${-position.y}px`);
          card.style.setProperty("--delay", `${Math.min(index * 22, 1100)}ms`);
        } else {
          card.style.animation = "none";
        }

        const image = document.createElement("img");
        image.src = getPublicURL(photo.storage_path);
        image.alt = "A memory";
        image.loading = index < 12 ? "eager" : "lazy";
        image.draggable = false;

        image.onerror = () => {
          image.alt = "Image could not be loaded";
          image.style.opacity = "0.35";
        };

        const date = document.createElement("span");
        date.className = "card-date";
        date.textContent = formatDate(photo.captured_at || photo.uploaded_at);

        card.append(image, date);

        if (session) {
          const controls = document.createElement("div");
          controls.className = "card-controls";

          const dateButton = document.createElement("button");
          dateButton.textContent = "✎ Date";
          dateButton.title = "Change photo date";

          dateButton.onclick = async event => {
            event.stopPropagation();
            await editDate(photo);
          };

          const deleteButton = document.createElement("button");
          deleteButton.textContent = "🗑️";
          deleteButton.title = "Delete this photo";

          deleteButton.onclick = async event => {
            event.stopPropagation();
            await deleteOnePhoto(photo);
          };

          controls.append(dateButton, deleteButton);
          card.append(controls);
        }

        world.append(card);
      });

      applyWorldTransform();
    }

    /* ==========================================
       LOGIN AND AUTHENTICATION
       ========================================== */

    function updateAuthUI() {
      $("loginBtn").classList.toggle("hidden", !!session);
      $("uploadBtn").classList.toggle("hidden", !session);
      $("deleteAllBtn").classList.toggle("hidden", !session);
      $("titleBtn").classList.toggle("hidden", !session);
      $("logoutBtn").classList.toggle("hidden", !session);
      $("universe").classList.toggle("editing", !!session);

      render(false);
    }

    $("loginBtn").onclick = () => {
      $("loginPanel").classList.remove("hidden");
    };

    $("cancelLogin").onclick = () => {
      $("loginPanel").classList.add("hidden");
    };

    $("loginForm").onsubmit = async event => {
      event.preventDefault();

      if (busy) return;

      busy = true;
      status("Logging in…");

      try {
        const { data, error } = await db.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

        if (error) throw error;

        session = data.session;
        $("loginPanel").classList.add("hidden");
        $("password").value = "";

        updateAuthUI();
        status("Welcome back! ♡");
      } catch (error) {
        status("Login failed: " + error.message);
      } finally {
        busy = false;
      }
    };

    $("logoutBtn").onclick = async () => {
      if (busy) return;

      const { error } = await db.auth.signOut();

      if (error) {
        status("Couldn't log out: " + error.message);
        return;
      }

      session = null;
      updateAuthUI();
      status("Logged out. Thanks for visiting ☁️");
    };

    db.auth.onAuthStateChange((_event, newSession) => {
      session = newSession;
      updateAuthUI();
    });

    /* ==========================================
       LOAD PHOTOS
       ========================================== */

    async function loadPhotos() {
      status("Loading your memories…");

      const { data, error } = await db
        .from("photos")
        .select("*")
        .order("sort_order", { ascending: true });

      if (error) {
        console.error(error);
        status("Couldn't load photos: " + error.message);
        return;
      }

      photos = data || [];
      render(true);

      status(
        photos.length
          ? `${photos.length} little memories in your universe ☁️`
          : "Your universe is empty. Add your first memories ♡"
      );
    }

    /* ==========================================
       UPLOAD PHOTOS
       ========================================== */

    $("uploadBtn").onclick = () => {
      if (!session) {
        status("Please log in first.");
        return;
      }

      $("fileInput").click();
    };

    $("fileInput").onchange = async () => {
      const files = Array.from($("fileInput").files || []);
      $("fileInput").value = "";

      if (!files.length) return;

      if (!session) {
        status("Please log in before uploading.");
        return;
      }

      if (busy) {
        status("Please wait for the current task to finish.");
        return;
      }

      busy = true;
      $("uploadBtn").disabled = true;
      $("deleteAllBtn").disabled = true;

      let uploaded = 0;
      let skipped = 0;
      let failed = 0;

      try {
        for (let index = 0; index < files.length; index++) {
          const file = files[index];

          if (!file.type.startsWith("image/")) {
            skipped++;
            continue;
          }

          if (file.size > 20 * 1024 * 1024) {
            failed++;
            status(`Skipped ${file.name}: larger than 20 MB.`);
            continue;
          }

          status(`Uploading ${index + 1} of ${files.length}: ${file.name}`);

          try {
            const digest = await sha256(file);

            const { data: duplicate, error: duplicateError } = await db
              .from("photos")
              .select("id")
              .eq("content_sha256", digest)
              .maybeSingle();

            if (duplicateError) throw duplicateError;

            if (duplicate) {
              skipped++;
              continue;
            }

            const storagePath =
              `${crypto.randomUUID()}-${safeFilename(file.name)}`;

            const { error: storageError } = await db.storage
              .from(BUCKET)
              .upload(storagePath, file, {
                contentType: file.type,
                upsert: false
              });

            if (storageError) throw storageError;

            const { error: rowError } = await db
              .from("photos")
              .insert({
                storage_path: storagePath,
                original_filename: file.name,
                captured_at: new Date(file.lastModified).toISOString(),
                content_sha256: digest
              });

            if (rowError) {
              // Try to clean up an uploaded file if its database insert fails.
              const { error: cleanupError } = await db.storage
                .from(BUCKET)
                .remove([storagePath]);

              if (cleanupError) {
                console.error("Failed to clean up an unregistered image:", cleanupError);
              }

              throw rowError;
            }

            uploaded++;
          } catch (error) {
            console.error("Upload failed:", file.name, error);
            failed++;
          }
        }

        await loadPhotos();

        status(
          `Finished! Uploaded ${uploaded}, skipped ${skipped}, failed ${failed}. ☁️`
        );
      } finally {
        busy = false;
        $("uploadBtn").disabled = false;
        $("deleteAllBtn").disabled = false;
      }
    };

    /* ==========================================
       EDIT PHOTO DATE
       ========================================== */

    async function editDate(photo) {
      if (!session || busy) return;

      const current = photo.captured_at
        ? new Date(photo.captured_at)
        : new Date();

      const dateInput = [
        current.getFullYear(),
        String(current.getMonth() + 1).padStart(2, "0"),
        String(current.getDate()).padStart(2, "0")
      ].join("-");

      const entered = prompt("Enter the date (YYYY-MM-DD):", dateInput);

      if (entered === null) return;

      if (!/^\d{4}-\d{2}-\d{2}$/.test(entered)) {
        status("Please use the format YYYY-MM-DD.");
        return;
      }

      const parsed = new Date(`${entered}T12:00:00`);

      if (Number.isNaN(parsed.getTime()) ||
          parsed.toISOString().slice(0, 10) !== entered) {
        status("That date isn't valid.");
        return;
      }

      busy = true;

      try {
        const { error } = await db
          .from("photos")
          .update({ captured_at: parsed.toISOString() })
          .eq("id", photo.id);

        if (error) throw error;

        photo.captured_at = parsed.toISOString();
        render(false);
        status("Memory date updated ♡");
      } catch (error) {
        status("Couldn't update date: " + error.message);
      } finally {
        busy = false;
      }
    }

    /* ==========================================
       DELETE ONE PHOTO
       ========================================== */

    async function deleteOnePhoto(photo) {
      if (!session || busy) {
        status("Please log in and wait for any current task to finish.");
        return;
      }

      const confirmed = confirm(
        "Delete this photo?\n\nThis action cannot be undone."
      );

      if (!confirmed) return;

      busy = true;
      $("uploadBtn").disabled = true;
      $("deleteAllBtn").disabled = true;

      try {
        // Remove the storage object first. If that fails, keep its database row.
        const { error: storageError } = await db.storage
          .from(BUCKET)
          .remove([photo.storage_path]);

        if (storageError) throw storageError;

        const { error: rowError } = await db
          .from("photos")
          .delete()
          .eq("id", photo.id);

        if (rowError) {
          throw new Error(
            "The image file was removed, but the database record could not be deleted: " +
            rowError.message
          );
        }

        photos = photos.filter(item => item.id !== photo.id);
        render(false);
        status("Photo deleted ♡");
      } catch (error) {
        console.error(error);
        await loadPhotos();
        status("Couldn't fully delete the photo: " + error.message);
      } finally {
        busy = false;
        $("uploadBtn").disabled = false;
        $("deleteAllBtn").disabled = false;
      }
    }

    /* ==========================================
       DELETE ALL PHOTOS
       ========================================== */

    $("deleteAllBtn").onclick = async () => {
      if (!session || busy) {
        status("Please log in and wait for any current task to finish.");
        return;
      }

      if (!photos.length) {
        status("Your photo wall is already empty ♡");
        return;
      }

      const count = photos.length;

      const confirmed = confirm(
        `⚠️ DELETE ALL ${count} PHOTOS?\n\n` +
        "This will remove the images and their photo records from your wall.\n\n" +
        "This action cannot be undone.\n\n" +
        "Are you sure you want to continue?"
      );

      if (!confirmed) return;

      // Extra confirmation to prevent an accidental click.
      const typed = prompt(
        `To confirm deletion of all ${count} photos, type DELETE ALL:`
      );

      if (typed !== "DELETE ALL") {
        status("Delete All cancelled. Your photos are safe ♡");
        return;
      }

      busy = true;
      $("deleteAllBtn").disabled = true;
      $("uploadBtn").disabled = true;

      try {
        const snapshot = [...photos];
        const paths = snapshot.map(photo => photo.storage_path);

        status("Removing stored images…");

        // Remove files in batches of up to 100.
        // If storage removal fails, leave the database rows in place.
        for (let i = 0; i < paths.length; i += 100) {
          const batch = paths.slice(i, i + 100);

          const { error } = await db.storage
            .from(BUCKET)
            .remove(batch);

          if (error) {
            throw new Error(
              "Storage cleanup stopped. Some images may already have been removed. " +
              error.message
            );
          }
        }

        status("Removing photo records…");

        // Delete only the records loaded for this wall.
        // Delete individually so a permission or row error can be identified.
        for (const photo of snapshot) {
          const { error } = await db
            .from("photos")
            .delete()
            .eq("id", photo.id);

          if (error) {
            throw new Error(
              "Some images were removed, but a photo record could not be deleted: " +
              error.message
            );
          }
        }

        photos = [];
        render(false);

        status("All photos deleted! Your universe is ready for a fresh batch ☁️💗");
      } catch (error) {
        console.error("Delete All error:", error);

        // Refresh to show the actual database state after any partial operation.
        await loadPhotos();

        status(
          "Delete All didn't finish completely: " +
          error.message +
          " Check the wall before trying again."
        );
      } finally {
        busy = false;
        $("deleteAllBtn").disabled = false;
        $("uploadBtn").disabled = false;
      }
    };

    /* ==========================================
       CHANGE WALL TITLE
       ========================================== */

    $("titleBtn").onclick = () => {
      if (!session) return;

      const current = $("wallTitle").textContent;
      const entered = prompt("Give your universe a title ♡", current);

      if (entered === null || !entered.trim()) return;

      $("wallTitle").textContent = entered.trim();
    };

    /* ==========================================
       ZOOM AND DRAG
       ========================================== */

    function clampZoom(value) {
      return Math.min(3, Math.max(0.35, value));
    }

    $("universe").addEventListener("wheel", event => {
      event.preventDefault();

      const previousZoom = zoom;
      const factor = event.deltaY < 0 ? 1.1 : 0.9;
      zoom = clampZoom(zoom * factor);

      const rect = $("universe").getBoundingClientRect();
      const pointerX = event.clientX - rect.left - rect.width / 2;
      const pointerY = event.clientY - rect.top - rect.height / 2;

      const ratio = zoom / previousZoom;

      panX = pointerX - (pointerX - panX) * ratio;
      panY = pointerY - (pointerY - panY) * ratio;

      applyWorldTransform();
    }, { passive: false });

    $("universe").addEventListener("pointerdown", event => {
      if (event.target.closest("button")) return;

      dragging = true;
      dragStartX = event.clientX;
      dragStartY = event.clientY;
      initialPanX = panX;
      initialPanY = panY;

      $("universe").classList.add("dragging");
      $("universe").setPointerCapture(event.pointerId);
    });

    $("universe").addEventListener("pointermove", event => {
      if (!dragging) return;

      panX = initialPanX + event.clientX - dragStartX;
      panY = initialPanY + event.clientY - dragStartY;

      applyWorldTransform();
    });

    function stopDragging() {
      dragging = false;
      $("universe").classList.remove("dragging");
    }

    $("universe").addEventListener("pointerup", stopDragging);
    $("universe").addEventListener("pointercancel", stopDragging);

    let activeTouches = new Map();

    $("universe").addEventListener("touchstart", event => {
      for (const touch of event.changedTouches) {
        activeTouches.set(touch.identifier, {
          x: touch.clientX,
          y: touch.clientY
        });
      }

      if (activeTouches.size === 2) {
        const points = [...activeTouches.values()];

        pinchStartDistance = Math.hypot(
          points[0].x - points[1].x,
          points[0].y - points[1].y
        );

        pinchStartZoom = zoom;
      }
    }, { passive: true });

    $("universe").addEventListener("touchmove", event => {
      if (activeTouches.size !== 2) return;

      const touches = [...event.touches];

      if (touches.length < 2) return;

      const distance = Math.hypot(
        touches[0].clientX - touches[1].clientX,
        touches[0].clientY - touches[1].clientY
      );

      if (pinchStartDistance > 0) {
        zoom = clampZoom(
          pinchStartZoom * distance / pinchStartDistance
        );

        applyWorldTransform();
      }
    }, { passive: true });

    function clearTouches(event) {
      for (const touch of event.changedTouches) {
        activeTouches.delete(touch.identifier);
      }

      if (activeTouches.size < 2) {
        pinchStartDistance = 0;
      }
    }

    $("universe").addEventListener("touchend", clearTouches);
    $("universe").addEventListener("touchcancel", clearTouches);

    /* ==========================================
       START THE WEBSITE
       ========================================== */

    async function start() {
      try {
        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        session = data.session;
        updateAuthUI();
        await loadPhotos();
      } catch (error) {
        console.error(error);
        status("Couldn't start the website: " + error.message);
      }
    }

    start();
  </script>
</body>
